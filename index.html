<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#07111F" />
    <meta
      name="description"
      content="Portfolio of Noura Lachgar — creative frontend developer and designer crafting futuristic, responsive digital experiences with a subtle Moroccan geometric identity."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Noura Lachgar — Creative Developer & Designer" />
    <meta
      property="og:description"
      content="Futuristic interfaces, shaped by clean code, motion and a subtle Moroccan geometric identity."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Manrope:wght@300..800&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Noura Lachgar — Web Developer & Designer</title>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('theme');
          var theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';

          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = theme;

          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', theme === 'dark' ? '#07111F' : '#F5EBDD');
          }

          var lang = localStorage.getItem('lang');
          if (lang === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (error) {
          void error;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
